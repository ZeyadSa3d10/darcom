<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Darcom — Premium real estate marketplace for chalets, apartments, villas and vacation properties across Egypt." />
  <meta name="theme-color" content="#14424f" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- TODO(launch): replace darcom.example.com with the real production domain
       in canonical, og:url, sitemap.xml and robots.txt -->
  <link rel="canonical" href="https://www.darcom.example.com/" />
  <!-- Open Graph (per-property tags are injected at runtime, see useSeo) -->
  <meta property="og:site_name" content="Darcom" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.darcom.example.com/" />
  <meta property="og:title" content="Darcom — Premium Real Estate Marketplace" />
  <meta property="og:description"
    content="Chalets, villas and apartments across Egypt's coasts and cities — verified listings, transparent prices." />
  <meta property="og:image" content="/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Darcom — Find a Place Worth Calling Home" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Darcom — Premium Real Estate Marketplace" />
  <meta name="twitter:description"
    content="Chalets, villas and apartments across Egypt's coasts and cities — verified listings, transparent prices." />
  <meta name="twitter:image" content="/og-image.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800;900&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
    rel="stylesheet" />
  <style id="darcom-critical-loader-css">
    .darcom-splash-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a2228;
      overflow: hidden;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.6s ease;
      will-change: opacity, transform;
    }

    .darcom-splash-loader.fade-out {
      opacity: 0;
      transform: scale(1.1);
      filter: blur(8px);
      pointer-events: none;
    }

    .splash-spin-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      gap: 1.75rem;
    }

    .splash-orbit-ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #c9a86a;
      border-right-color: rgba(255, 255, 255, 0.6);
      filter: drop-shadow(0 0 10px rgba(201, 168, 106, 0.6));
      animation: orbitRotate 1.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      pointer-events: none;
    }

    .splash-orbit-ring-outer {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      animation: orbitRotateReverse 4s linear infinite;
      pointer-events: none;
    }

    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes orbitRotateReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .splash-logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      animation: logo3DSpin 1.5s cubic-bezier(0.35, 1.25, 0.65, 1) infinite;
    }

    @keyframes logo3DSpin {
      0% {
        transform: rotateY(0deg) scale(0.92);
      }
      50% {
        transform: rotateY(180deg) scale(1.08);
      }
      100% {
        transform: rotateY(360deg) scale(0.92);
      }
    }

    .splash-logo-img {
      width: 105px;
      height: 105px;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.5))
              drop-shadow(0 0 24px rgba(201, 168, 106, 0.35));
      backface-visibility: visible;
    }
  </style>
  <title>Darcom — Premium Real Estate Marketplace</title>
</head>

<body>
  <!-- Instant Animated Luxury Loader (Active from 0ms before React parses) -->
  <div id="initial-loader" class="darcom-splash-loader" aria-label="Darcom Loading" role="status">
    <div class="splash-spin-stage">
      <div class="splash-orbit-ring" aria-hidden="true"></div>
      <div class="splash-orbit-ring-outer" aria-hidden="true"></div>
      <div class="splash-logo-wrap">
        <img src="/logo-white.png" alt="Darcom Logo" class="splash-logo-img" />
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
